name: SEO Optimization

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  seo-optimization:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract module info
        id: module-info
        run: |
          MODULE_NAME=$(basename $(pwd))
          echo "module-name=$MODULE_NAME" >> $GITHUB_OUTPUT
          
          if [ -f "composer.json" ]; then
            VERSION=$(grep '"version"' composer.json | sed 's/.*"version": "\(.*\)".*/\1/' || echo "1.0.0")
          elif [ -f "VERSION" ]; then
            VERSION=$(cat VERSION)
          else
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate sitemap
        run: |
          cat > sitemap.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://github.com/${{ github.repository }}</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <priority>1.0</priority>
              <changefreq>weekly</changefreq>
            </url>
            <url>
              <loc>https://github.com/${{ github.repository }}/blob/main/README.md</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <priority>0.8</priority>
              <changefreq>monthly</changefreq>
            </url>
          </urlset>
          EOF

      - name: Generate robots.txt
        run: |
          cat > robots.txt << EOF
          User-agent: *
          Allow: /
          Sitemap: https://github.com/${{ github.repository }}/sitemap.xml
          EOF

      - name: Generate SEO metadata
        run: |
          cat > seo.json << EOF
          {
            "title": "${{ steps.module-info.outputs.module-name }} - Laravel Module",
            "description": "High-quality Laravel module for ${{ steps.module-info.outputs.module-name }} with comprehensive documentation and active support.",
            "keywords": "Laravel, PHP, ${{ steps.module-info.outputs.module-name }}, Open Source, PTVX",
            "author": "PTVX Team",
            "url": "https://github.com/${{ github.repository }}",
            "image": "https://github.com/${{ github.repository }}/raw/main/assets/preview.png",
            "type": "website"
          }
          EOF

      - name: Optimize README with SEO
        run: |
          if [ -f "README.md" ]; then
            # Add SEO section to README
            cat > seo-section.md << 'EOF'
          
          ## 🔍 SEO & Discovery

          **Keywords**: Laravel, PHP, PTVX, Open Source, Web Development
          
          **Categories**: 
          - 📦 Laravel Packages
          - 🚀 Development Tools
          - 🛠️ Code Quality
          - 📊 Business Applications

          **Search Terms**: 
          - Laravel ${{ steps.module-info.outputs.module-name }} module
          - PHP ${{ steps.module-info.outputs.module-name }} package
          - Open source Laravel components
          - PTVX modular architecture
          
          EOF
            
            # Insert SEO section before existing footer
            temp_file=$(mktemp)
            head -n -5 README.md > temp_file
            cat seo-section.md >> temp_file
            tail -5 README.md >> temp_file
            mv temp_file README.md
          fi

      - name: Generate package.json for SEO
        run: |
          cat > package.json << EOF
          {
            "name": "ptvx-${{ steps.module-info.outputs.module-name }}",
            "version": "${{ steps.module-info.outputs.version }}",
            "description": "High-quality Laravel module for ${{ steps.module-info.outputs.module-name }}",
            "keywords": ["laravel", "php", "ptvx", "${{ steps.module-info.outputs.module-name }}", "opensource"],
            "repository": {
              "type": "git",
              "url": "https://github.com/${{ github.repository }}.git"
            },
            "homepage": "https://github.com/${{ github.repository }}",
            "author": "PTVX Team",
            "license": "MIT",
            "scripts": {
              "seo:generate": "node scripts/generate-seo.js"
            }
          }
          EOF

      - name: Create .htaccess for SEO
        run: |
          cat > .htaccess << EOF
          # SEO Optimizations
          <IfModule mod_rewrite.c>
            RewriteEngine On
          
            # Redirect www to non-www
            RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
            RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]
          
            # Add trailing slash
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_URI} !/$
            RewriteRule . %{REQUEST_URI}/ [R=301,L]
          </IfModule>
          
          # Security Headers
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set X-XSS-Protection "1; mode=block"
          </IfModule>
          
          # Cache Control
          <IfModule mod_expires.c>
            ExpiresActive on
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
          </IfModule>
          EOF

      - name: Generate Open Graph meta tags
        run: |
          cat > opengraph.html << EOF
          <!-- Open Graph Meta Tags -->
          <meta property="og:title" content="${{ steps.module-info.outputs.module-name }} - Laravel Module">
          <meta property="og:description" content="High-quality Laravel module for ${{ steps.module-info.outputs.module-name }} with comprehensive documentation.">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://github.com/${{ github.repository }}">
          <meta property="og:image" content="https://github.com/${{ github.repository }}/raw/main/assets/preview.png">
          <meta property="og:site_name" content="PTVX Modules">
          <meta property="og:locale" content="en_US">
          
          <!-- Twitter Card Meta Tags -->
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="${{ steps.module-info.outputs.module-name }} - Laravel Module">
          <meta name="twitter:description" content="High-quality Laravel module for ${{ steps.module-info.outputs.module-name }}">
          <meta name="twitter:image" content="https://github.com/${{ github.repository }}/raw/main/assets/preview.png">
          
          <!-- Additional SEO Meta Tags -->
          <meta name="description" content="High-quality Laravel module for ${{ steps.module-info.outputs.module-name }} with comprehensive documentation and active support.">
          <meta name="keywords" content="Laravel, PHP, ${{ steps.module-info.outputs.module-name }}, Open Source, PTVX, Web Development">
          <meta name="author" content="PTVX Team">
          <meta name="robots" content="index, follow">
          <link rel="canonical" href="https://github.com/${{ github.repository }}">
          EOF

      - name: Commit SEO improvements
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md sitemap.xml robots.txt seo.json package.json .htaccess opengraph.html 2>/dev/null || true
          git commit -m "🔍 Add SEO optimization elements [skip ci]" || true
          git push