# Canon: docs/wiki/how-to/github-actions-semantic-release-stack.md
name: Semantic Release (module propagation)

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches: ["*"]

permissions:
  contents: read
  actions: read

jobs:
  detect-modules:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect changed modules
        id: detect
        run: |
          MODULES=$(git diff --name-only "${{ github.event.workflow_run.head_sha }}^" "${{ github.event.workflow_run.head_sha }}" \
            | grep -E '^laravel/Modules/[^/]+/' \
            | cut -d/ -f3 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=${MODULES:-[]}" >> "$GITHUB_OUTPUT"

  release-modules:
    needs: detect-modules
    if: needs.detect-modules.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    uses: ./.github/workflows/module-release.yml
    with:
      module-name: ${{ matrix.module }}
      module-path: laravel/Modules
    secrets: inherit
