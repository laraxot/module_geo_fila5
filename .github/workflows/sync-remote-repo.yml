name: Sync Remote Repos

on:
  # Schedule: Daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      org:
        description: 'Organization override (optional)'
        required: false
        default: ''
      
      verbose:
        description: 'Verbose logging'
        required: false
        default: 'false'
  
  # On push to gitmodules config
  push:
    branches:
      - main
      - dev
    paths:
      - 'gitmodules.ini'
      - 'bashscripts/git/subtrees/**'

jobs:
  sync:
    name: Sync Subtrees
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Verify Script Exists
        run: |
          if [ ! -f "bashscripts/git/subtrees/sync_remote_repo.sh" ]; then
            echo "❌ sync_remote_repo.sh not found"
            exit 1
          fi
          chmod +x bashscripts/git/subtrees/sync_remote_repo.sh
      
      - name: Verify gitmodules.ini
        run: |
          if [ ! -f "gitmodules.ini" ]; then
            echo "❌ gitmodules.ini not found"
            exit 1
          fi
          echo "✅ Found gitmodules.ini"
          cat gitmodules.ini
      
      - name: Run Sync Script
        env:
          ORG: ${{ github.event.inputs.org }}
          VERBOSE: ${{ github.event.inputs.verbose }}
          CI: 'true'
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🔄 Starting sync at $(date)"
          ./bashscripts/git/subtrees/sync_remote_repo.sh "$ORG"
          echo "✅ Sync completed at $(date)"
      
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_id }}
          path: |
            *.log
            sync-report-*.json
          retention-days: 30
      
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Sync Remote Repo Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `Sync failed in workflow run: ${workflowUrl}\n\nPlease check the logs and fix the issue.`
            })
      
      - name: Comment on Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('✅ Sync completed successfully');
