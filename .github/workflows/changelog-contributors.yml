# Report settimanale contributori (grafici + tabella) senza attendere release
name: Changelog Contributors Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 3"

permissions:
  contents: write

jobs:
  contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Last 30 days analytics
        env:
          CHANGELOG_FROM_TAG: ""
          CHANGELOG_TO_REF: HEAD
          OUTPUT_MD: docs/chat/changelog-contributors-weekly.md
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          SINCE=$(date -u -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-30d +%Y-%m-%d)
          export CHANGELOG_FROM_TAG=""
          git log --since="$SINCE" --no-merges --pretty=format:%H >/dev/null || true
          node bashscripts/ci/generate-changelog-report.mjs
          {
            echo ""
            echo "> Periodo: ultimi 30 giorni (da ${SINCE})"
          } >> docs/chat/changelog-contributors-weekly.md

      - uses: actions/upload-artifact@v4
        with:
          name: changelog-contributors-${{ github.run_id }}
          path: |
            docs/chat/changelog-contributors-weekly.md
            CHANGELOG-ANALYTICS.json

      - name: Commit weekly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chat/changelog-contributors-weekly.md CHANGELOG-ANALYTICS.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "docs(changelog): weekly contributors report [skip ci]"
          git push || true
