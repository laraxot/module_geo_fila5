<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
  <style>
    @keyframes arrow-bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-5px);
      }
      60% {
        transform: translateY(-2px);
      }
    }
    .arrow {
      animation: arrow-bounce 2s ease infinite;
      transform-origin: center;
    }
    @keyframes tray-pulse {
      0%, 100% {
        stroke-width: 1.5;
      }
      50% {
        stroke-width: 2;
      }
    }
    .tray {
      animation: tray-pulse 2s ease infinite;
    }
  </style>
  
  <!-- Tray -->
  <path class="tray" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
  
  <!-- Arrow -->
  <path class="arrow" d="M12 3v13.5M7.5 7.5L12 3l4.5 4.5" />
</svg>