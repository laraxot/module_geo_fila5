global_context: |
  Laraxot / FixCity workspace (base_fixcity_fila5).
  Pattern LLM Wiki applicato a tutti i moduli e temi:
    docs/         = raw source layer (corpus immutabile)
    docs/wiki/    = compiled LLM wiki layer (AI sintetizza qui)
    docs/wiki/concepts/    = topic e pattern architetturali
    docs/wiki/entities/    = classi, componenti, service
    docs/wiki/summaries/   = sommari documenti
    docs/wiki/comparisons/ = analisi sintetizzate
    docs/wiki/overviews/   = panoramiche modulo/tema
  Usa sempre qmd search prima di rispondere o scrivere nuova documentazione.
