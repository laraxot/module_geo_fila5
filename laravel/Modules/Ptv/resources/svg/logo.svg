<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 200 200" 
     width="200" 
     height="200"
     role="img"
     aria-label="Logo Provincia di Treviso">
    
    <!-- Definizioni per gradienti e pattern -->
    <defs>
        <!-- Gradiente oro per il leone -->
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
        </linearGradient>
        
        <!-- Gradiente rosso per lo scudo -->
        <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
        </linearGradient>
        
        <!-- Ombreggiatura -->
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="2" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Background circle -->
    <circle cx="100" cy="100" r="95" fill="url(#redGradient)" stroke="#fff" stroke-width="2" opacity="0.95"/>
    
    <!-- Scudo -->
    <path d="M 100 30 L 70 40 L 50 65 L 50 115 L 70 140 L 100 170 L 130 140 L 150 115 L 150 65 L 130 40 Z" 
          fill="url(#redGradient)" 
          stroke="#fff" 
          stroke-width="2"
          filter="url(#shadow)"/>
    
    <!-- Leone rampante (simbolo di Venezia/Veneto) -->
    <g transform="translate(100, 100)">
        <!-- Corpo del leone -->
        <ellipse cx="0" cy="10" rx="25" ry="35" fill="url(#goldGradient)" opacity="0.95"/>
        
        <!-- Testa del leone -->
        <circle cx="0" cy="-25" r="18" fill="url(#goldGradient)" opacity="0.95"/>
        
        <!-- Criniera -->
        <path d="M -15 -35 Q -5 -40 0 -35 Q 5 -40 15 -35 Q 12 -42 0 -45 Q -12 -42 -15 -35 Z" 
              fill="url(#goldGradient)" opacity="0.95"/>
        
        <!-- Zampe posteriori -->
        <ellipse cx="-18" cy="25" rx="8" ry="12" fill="url(#goldGradient)" opacity="0.95"/>
        <ellipse cx="18" cy="25" rx="8" ry="12" fill="url(#goldGradient)" opacity="0.95"/>
        
        <!-- Zampa anteriore sinistra (rampante) -->
        <path d="M -25 -5 Q -30 -15 -25 -25 Q -20 -20 -15 -15 L -20 -10 Q -25 -5 -25 -5 Z" 
              fill="url(#goldGradient)" opacity="0.95"/>
        
        <!-- Zampa anteriore destra (rampante) -->
        <path d="M 25 -5 Q 30 -15 25 -25 Q 20 -20 15 -15 L 20 -10 Q 25 -5 25 -5 Z" 
              fill="url(#goldGradient)" opacity="0.95"/>
        
        <!-- Coda -->
        <path d="M -20 30 Q -35 20 -40 10 Q -38 8 -35 12 Q -30 18 -25 25 Z" 
              fill="url(#goldGradient)" opacity="0.95"/>
        
        <!-- Occhi -->
        <circle cx="-5" cy="-28" r="2" fill="#000"/>
        <circle cx="5" cy="-28" r="2" fill="#000"/>
        
        <!-- Bocca -->
        <path d="M -3 -20 Q 0 -18 3 -20" stroke="#000" stroke-width="1.5" fill="none"/>
        
        <!-- Dettagli zampa -->
        <circle cx="-28" cy="-20" r="3" fill="#000" opacity="0.5"/>
        <circle cx="28" cy="-20" r="3" fill="#000" opacity="0.5"/>
        
        <!-- Corona (simbolo di potere/autonomia) -->
        <path d="M -15 -50 L -12 -45 L -5 -48 L 0 -45 L 5 -48 L 12 -45 L 15 -50 L 15 -42 L 0 -38 L -15 -42 Z" 
              fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
        <circle cx="-12" cy="-45" r="1.5" fill="#DC143C"/>
        <circle cx="0" cy="-45" r="1.5" fill="#DC143C"/>
        <circle cx="12" cy="-45" r="1.5" fill="#DC143C"/>
    </g>
    
    <!-- Testo "PTV" stilizzato (opzionale, in basso) -->
    <text x="100" y="185" 
          font-family="Arial, sans-serif" 
          font-size="20" 
          font-weight="bold" 
          fill="#fff" 
          text-anchor="middle"
          opacity="0.9">PTV</text>
    
</svg>

